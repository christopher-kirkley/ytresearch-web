[project]
name = "ytresearch-web"
version = "0.1.0"
description = "Web frontend for ytresearch metadata service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ytresearch",
    "flask",
    "psycopg2-binary",
    "python-dotenv",
    "flask-login",
    "flask-wtf>=1.2.2",
    "flask-limiter>=4.1.1",
]

[project.scripts]
ytresearch-web = "ytresearch_web.app:create_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytresearch_web"]

[tool.uv.sources]
ytresearch = { path = "../ytresearch", editable = true }
