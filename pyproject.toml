[project]
name = "ytresearch-web"
version = "0.1.0"
description = "Web frontend for ytresearch metadata service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ytresearch",
    "flask",
    "python-dotenv",
    "flask-login",
    "flask-wtf>=1.2.2",
    "flask-limiter>=4.1.1",
    "waitress>=3",
    "markdown>=3.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ytresearch-web = "ytresearch_web.app:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytresearch_web"]

[tool.uv.sources]
ytresearch = { git = "https://github.com/christopher-kirkley/ytresearch.git", branch = "master" }
